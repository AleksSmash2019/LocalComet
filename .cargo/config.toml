# LocalComet repository-level Cargo routing.
#
# Keep direct/IDE cargo invocations outside the source tree. The repository
# launcher and CI may still provide an explicit CARGO_TARGET_DIR for the
# canonical per-user BuildCache. These relative paths resolve outside this
# repository from the workspace root and avoid creating a local target tree.
#
# INC-006 evidence must fail if a cargo invocation resolves elsewhere.
[build]
target-dir = "../../AppData/Local/LocalComet/BuildCache/CargoTarget"
build-dir = "../../AppData/Local/LocalComet/BuildCache/CargoTarget/build"
