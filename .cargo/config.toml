# LocalComet repository-level Cargo routing.
#
# Keep direct/IDE cargo invocations on the same external target used by the
# normal Windows launcher. This machine-specific path is intentional for the
# attached LocalComet workspace: it prevents a second sibling target tree from
# silently consuming disk and keeps all cargo artifacts under the audited
# LocalComet BuildCache. The launcher and gate scripts still pass an explicit
# CARGO_TARGET_DIR and remain authoritative for portable/deployed runs.
#
# INC-006 evidence must fail if a cargo invocation resolves elsewhere.
[build]
target-dir = "C:/Users/DNS/AppData/Local/LocalComet/BuildCache/CargoTarget"
build-dir = "C:/Users/DNS/AppData/Local/LocalComet/BuildCache/CargoTarget/build"
