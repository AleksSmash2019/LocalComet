[package]
name = "localcomet-desktop"
version = "7.0.5"
description = "LocalComet desktop visual shell"
edition = "2021"
default-run = "localcomet-desktop"

[lib]
name = "localcomet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Only the canonical hidden-desktop harness enables this to exercise a real
# post-grant cancellation path. It is intentionally absent from normal builds.
isolated-cu-test-hook = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
subtle = "2.6"
tauri = { version = "2.11.5", features = [] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
] }
sysinfo = "0.31"
raw-cpuid = "11.6.0"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
