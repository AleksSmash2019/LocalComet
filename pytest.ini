[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = .git .venv __pycache__ node_modules target artifacts audit reports
addopts = --strict-markers

# Generated evidence/matrix scripts under artifacts/ are run only by their
# dedicated gate wrappers; they are not pytest modules. The desktop build's
# copied sidecar tests under target/ are likewise excluded from collection.

[pytest_asyncio]
asyncio_mode = auto

markers =
    slow: bounded non-destructive integration checks
    native: checks requiring a native LocalComet runtime
    hidden_desktop: checks requiring the isolated Windows hidden desktop harness
